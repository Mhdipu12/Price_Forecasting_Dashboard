# ---------------------------------------------------------------------------
# Visual theme — colours, typography, radii.
#
# Everything that can be themed natively lives here rather than in CSS, so the
# app code stays free of styling and light and dark modes stay in step.
# Both modes are defined, so the Settings menu in the top-right can switch.
# ---------------------------------------------------------------------------

[theme]
# ---- typography ----------------------------------------------------------
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.84rem"
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
linkUnderline = false

# ---- shape ---------------------------------------------------------------
baseRadius = "14px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

# ---- data visualisation --------------------------------------------------
# Commodity series first, then the model series, so native charts inherit the
# same identity as the Plotly figures.
chartCategoricalColors = [
    "#E0459B",
    "#C98A3E",
    "#E5B00A",
    "#6366F1",
    "#10B981",
    "#A855F7",
    "#94A3B8",
    "#22D3EE",
]
# An aurora ramp: pale violet through indigo into deep space.
chartSequentialColors = [
    "#F3EEFF",
    "#E3D8FE",
    "#CDBBFC",
    "#B29AF8",
    "#9878F2",
    "#7C5CE6",
    "#6141CC",
    "#4A2FA6",
    "#341F80",
    "#1E1259",
]

# ===========================================================================
# Light mode
# ===========================================================================
[theme.light]
primaryColor = "#6D4AFF"
backgroundColor = "#F5F7FF"
secondaryBackgroundColor = "#ECEFFC"
codeBackgroundColor = "#EEF1FD"
textColor = "#101736"
linkColor = "#6D4AFF"
borderColor = "#E3E7F7"
codeTextColor = "#3B4570"

grayColor = "#6B7699"
blueColor = "#4F46E5"
greenColor = "#059669"
redColor = "#E11D48"
orangeColor = "#EA7317"
yellowColor = "#E5B00A"
violetColor = "#8B5CF6"

dataframeBorderColor = "#E3E7F7"
dataframeHeaderBackgroundColor = "#ECEFFC"

[theme.light.sidebar]
backgroundColor = "#F0F3FE"
secondaryBackgroundColor = "#E6EAFA"
codeBackgroundColor = "#E6EAFA"
textColor = "#101736"
borderColor = "#DDE2F5"
primaryColor = "#6D4AFF"
dataframeHeaderBackgroundColor = "#E6EAFA"
dataframeBorderColor = "#DDE2F5"

# ===========================================================================
# Dark mode
# ===========================================================================
[theme.dark]
primaryColor = "#7C5CFF"
backgroundColor = "#060912"
secondaryBackgroundColor = "#101A2E"
codeBackgroundColor = "#0C1424"
textColor = "#E9EEFC"
linkColor = "#C4B5FD"
borderColor = "#26314D"
codeTextColor = "#CBD5E1"

grayColor = "#8593B4"
blueColor = "#818CF8"
greenColor = "#34D399"
redColor = "#FB7185"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
violetColor = "#A78BFA"

dataframeBorderColor = "#26314D"
dataframeHeaderBackgroundColor = "#101A2E"

[theme.dark.sidebar]
backgroundColor = "#080D1A"
secondaryBackgroundColor = "#141F36"
codeBackgroundColor = "#0C1424"
textColor = "#E9EEFC"
borderColor = "#26314D"
primaryColor = "#A78BFA"
dataframeHeaderBackgroundColor = "#141F36"
dataframeBorderColor = "#26314D"

[server]
maxUploadSize = 50
enableStaticServing = true

[browser]
gatherUsageStats = false
